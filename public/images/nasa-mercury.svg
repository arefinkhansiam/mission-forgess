<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="mercuryGlow" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#dedad4" />
      <stop offset="30%" stop-color="#a8a39b" />
      <stop offset="65%" stop-color="#5a5650" />
      <stop offset="85%" stop-color="#2d2b28" />
      <stop offset="100%" stop-color="#0a0a09" />
    </radialGradient>
    <clipPath id="mercuryClip">
      <circle cx="256" cy="256" r="220" />
    </clipPath>
  </defs>
  <rect width="512" height="512" fill="#040b18" />
  <!-- Planet Body -->
  <circle cx="256" cy="256" r="220" fill="url(#mercuryGlow)" />
  <!-- Craters and ray systems -->
  <g clip-path="url(#mercuryClip)" opacity="0.4">
    <!-- Rayed crater Kuiper / Degas -->
    <circle cx="190" cy="180" r="18" fill="#d9d5ce" />
    <circle cx="190" cy="180" r="12" fill="#4d4a46" />
    <line x1="190" y1="180" x2="110" y2="120" stroke="#d9d5ce" stroke-width="2" opacity="0.5" />
    <line x1="190" y1="180" x2="280" y2="130" stroke="#d9d5ce" stroke-width="2" opacity="0.5" />
    <line x1="190" y1="180" x2="230" y2="260" stroke="#d9d5ce" stroke-width="2" opacity="0.5" />
    <line x1="190" y1="180" x2="130" y2="230" stroke="#d9d5ce" stroke-width="2" opacity="0.5" />
    <!-- Impact Basins -->
    <ellipse cx="320" cy="240" rx="35" ry="30" fill="#353330" opacity="0.7" />
    <ellipse cx="260" cy="340" rx="42" ry="34" fill="#383633" opacity="0.6" />
    <circle cx="150" cy="310" r="22" fill="#44413d" opacity="0.7" />
    <circle cx="360" cy="150" r="16" fill="#3b3935" opacity="0.7" />
    <circle cx="290" cy="120" r="14" fill="#cfcbc4" opacity="0.6" />
  </g>
</svg>

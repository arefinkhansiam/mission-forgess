<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="venusGlow" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff2d6" />
      <stop offset="25%" stop-color="#f5cf8e" />
      <stop offset="60%" stop-color="#bf8942" />
      <stop offset="85%" stop-color="#6e4418" />
      <stop offset="100%" stop-color="#1b0e03" />
    </radialGradient>
    <radialGradient id="venusAtmosphere" cx="50%" cy="50%" r="50%">
      <stop offset="88%" stop-color="#ffdfa0" stop-opacity="0" />
      <stop offset="97%" stop-color="#ffcf78" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#d49035" stop-opacity="0.8" />
    </radialGradient>
    <filter id="venusBlur">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <clipPath id="planetClip">
      <circle cx="256" cy="256" r="220" />
    </clipPath>
  </defs>
  <rect width="512" height="512" fill="#040b18" />
  <!-- Planet Body -->
  <circle cx="256" cy="256" r="220" fill="url(#venusGlow)" />
  <!-- Swirling cloud bands inside planet -->
  <g clip-path="url(#planetClip)" opacity="0.32" filter="url(#venusBlur)">
    <path d="M 30,180 Q 200,240 480,160 Q 320,130 30,180 Z" fill="#ffecc2" />
    <path d="M 20,240 Q 240,310 490,220 Q 310,210 20,240 Z" fill="#eed198" />
    <path d="M 40,310 Q 230,370 470,300 Q 280,280 40,310 Z" fill="#8f571b" />
    <path d="M 70,120 Q 260,170 440,110 Q 290,80 70,120 Z" fill="#fcf5e6" />
  </g>
  <!-- Atmospheric rim -->
  <circle cx="256" cy="256" r="220" fill="url(#venusAtmosphere)" />
</svg>
